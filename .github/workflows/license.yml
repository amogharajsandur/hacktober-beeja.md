name: License check
on: [pull_request]
permissions:
  contents: read
jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check MIT license
        run: |
          test -s LICENSE
          grep -Fx 'MIT License' LICENSE
          grep -F 'Permission is hereby granted, free of charge' LICENSE
