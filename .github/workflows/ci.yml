name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: lint-and-test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      # CI never calls a live model: tests inject deterministic providers.
      BEEJA_PROVIDER: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: CLI smoke test
        run: |
          beeja --help
          python -m beeja --version
          beeja schema > /dev/null
      - name: Unit, integration and regression tests
        run: pytest -q
  web:
    name: viewer-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Viewer data is generated from the committed records
        run: |
          pip install -e .
          beeja export-web --examples examples --out web/public/data
          git diff --exit-code web/public/data
      - name: Install, type-check, build and test the viewer
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test
